<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Attendance</title>
<meta name="theme-color" content="#16212B" />
<meta name="description" content="Clock in and out with location verification." />

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="offline-banner" id="offlineBanner">No connection — you can still fill this in, but it won't submit until you're back online.</div>

<main class="app">

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>Attendance</h1>
        <p class="subtitle" id="clockLine">—</p>
      </div>
    </div>
  </header>

  <section class="card">

    <div class="field">
      <label for="employeeId">Employee ID</label>
      <input
        id="employeeId"
        type="text"
        inputmode="text"
        autocomplete="off"
        autocapitalize="characters"
        placeholder="e.g. EMP001"
      />
      <p class="field-note" id="employeeNote">&nbsp;</p>
    </div>

    <div class="field">
      <span class="field-label-static">Action</span>
      <div class="toggle" role="radiogroup" aria-label="Attendance action">
        <button type="button" class="toggle-btn is-active" data-value="IN" role="radio" aria-checked="true">Clock In</button>
        <button type="button" class="toggle-btn" data-value="OUT" role="radio" aria-checked="false">Clock Out</button>
      </div>
    </div>

    <div class="field">
      <span class="field-label-static">Location</span>
      <button type="button" class="btn btn-secondary" id="locateBtn">
        <span class="btn-icon" aria-hidden="true">◎</span>
        Get current location
      </button>
      <p class="field-note" id="locationNote">Location not captured yet.</p>
    </div>

    <button type="button" class="btn btn-primary" id="submitBtn" disabled>
      Submit
    </button>

    <div class="result" id="result" hidden></div>

  </section>

  <button type="button" class="install-btn" id="installBtn" hidden>Install app on this device</button>

  <footer class="app-footer">
    <span id="statusDot" class="status-dot" aria-hidden="true"></span>
    <span id="statusText">Checking connection…</span>
  </footer>

</main>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
